name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout r2ps-client (sibling path dependency)
        run: git clone --depth 1 https://github.com/sirosfoundation/r2ps-client.git ../r2ps-client
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - run: cargo check --locked --all-features
        # `--all-features` enables `wasm` alongside `native`, and `src/ffi.rs`
        # is `#[cfg(all(feature = "native", not(feature = "wasm")))]` - so
        # the line above NEVER actually type-checks ffi.rs (wasm wins the
        # cfg). Check the real "every native plugin at once" configuration
        # explicitly too, or a change that only breaks ffi.rs compiles clean
        # here and fails only once something downstream regenerates bindings
        # against it.
      - run: cargo check --locked --features native,plugin-r2ps,plugin-android-keystore,plugin-apple-se

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout r2ps-client (sibling path dependency)
        run: git clone --depth 1 https://github.com/sirosfoundation/r2ps-client.git ../r2ps-client
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - run: cargo test --locked
      - run: cargo test --locked --features plugin-r2ps
      - run: cargo test --locked --features plugin-apple-se
        # None of the invocations above enables plugin-android-keystore, so
        # none of that plugin's tests (or the cross-plugin WIA+KA
        # coexistence integration test) ever ran in CI. Enables every
        # native plugin at once (not just plugin-android-keystore alone) so
        # the android-keystore + fido2 + r2ps + apple-se coexistence path -
        # the one that actually matters - gets exercised, not just each
        # plugin in isolation.
      - run: cargo test --locked --features native,plugin-r2ps,plugin-android-keystore,plugin-apple-se

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout r2ps-client (sibling path dependency)
        run: git clone --depth 1 https://github.com/sirosfoundation/r2ps-client.git ../r2ps-client
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - run: cargo clippy --locked --all-features -- -D warnings
        # Same ffi.rs blind spot as the Check job's --all-features line
        # (see its comment) - lint the real native+every-plugin
        # configuration too.
      - run: cargo clippy --locked --features native,plugin-r2ps,plugin-android-keystore,plugin-apple-se -- -D warnings

  bindings:
    name: Check bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout r2ps-client (sibling path dependency)
        run: git clone --depth 1 https://github.com/sirosfoundation/r2ps-client.git ../r2ps-client
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - run: make check-bindings

  wasm:
    name: Test (WASM, headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      # `cargo check --target wasm32-unknown-unknown` only proves the code
      # compiles for the target — it does NOT catch runtime-only failures
      # like std::time::SystemTime::now() panicking in a real browser
      # ("time not implemented on this platform"). wasm-pack test actually
      # loads and runs the module in headless Chrome.
      - run: wasm-pack test --headless --chrome --no-default-features --features wasm
