# SonarCloud code quality and security analysis.
name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/rust-toolchain
        with:
          # `llvm-tools` carries the `llvm-profdata`/`llvm-cov` that read the
          # counters instrumented builds write.
          components: llvm-tools
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov

      # Without a report the quality gate reads new code as 0% covered, and
      # the `main` ruleset's coverage condition then blocks every pull request
      # that adds a line — including dependabot's. Same feature set as the
      # `Test` job in ci.yml, so the two measure the same suite.
      - name: Coverage
        run: |
          cargo llvm-cov --locked --features plugin-r2ps \
            --lcov --output-path lcov.info
          echo "lcov.info: $(wc -l < lcov.info) lines"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.rust.lcov.reportPaths=lcov.info
            -Dsonar.exclusions=lcov.info,target/**
            -Dsonar.coverage.exclusions=src/wasm_ffi.rs,src/wasm_fido2.rs
