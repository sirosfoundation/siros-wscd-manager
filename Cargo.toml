[package]
name = "siros-wscd-manager"
version = "0.7.3"
edition = "2021"
license = "BSD-2-Clause"
description = "Pluggable WSCD manager for EUDI wallet key operations"
repository = "https://github.com/sirosfoundation/siros-wscd-manager"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "siros_wscd_manager"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = ["native"]
native = ["plugin-softkey", "plugin-fido2", "dep:uniffi", "dep:tokio"]
bindgen = ["dep:uniffi", "uniffi/cli"]
# josekit links OpenSSL; force the vendored build so Android cross-compiles
# (which have no system OpenSSL) build it from source.
plugin-softkey = ["josekit", "dep:openssl", "openssl/vendored"]
plugin-softkey-pure = []  # Softkey without josekit/OpenSSL (for WASM)
plugin-r2ps = ["r2ps-client"]
# previewSign (WebAuthn "sign extension" v4) — shared protocol module in
# src/preview_sign_protocol.rs, used identically by the native FFI transport
# bridge and the WASM browser transport.
plugin-fido2 = ["dep:ciborium", "dep:hkdf", "dep:sha2", "dep:hmac", "dep:aes", "dep:cbc", "dep:num-bigint", "p256/ecdh"]
# WASM target: uses wasm-bindgen instead of UniFFI, wasm-bindgen-futures instead of tokio.
# Enables softkey (pure Rust crypto, no native deps) and fido2 (WebAuthn
# previewSign transport, see src/wasm_fido2.rs).
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "dep:serde-wasm-bindgen", "dep:send_wrapper", "plugin-softkey-pure", "plugin-fido2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
p256 = { version = "0.14", features = ["ecdsa"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
base64ct = { version = "1", features = ["std"] }
rand = "0.10"
log = "0.4"
async-trait = "0.1"

# Native-only deps (excluded in WASM)
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread"], optional = true }
uniffi = { version = "0.28", optional = true }

# WASM-only deps
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = [
    "Crypto", "SubtleCrypto", "CryptoKey", "Window", "Navigator", "Location",
    "CredentialsContainer", "Credential", "PublicKeyCredential",
    "PublicKeyCredentialCreationOptions", "PublicKeyCredentialRpEntity",
    "PublicKeyCredentialUserEntity", "PublicKeyCredentialParameters",
    "PublicKeyCredentialType", "PublicKeyCredentialRequestOptions",
    "PublicKeyCredentialDescriptor", "AuthenticatorAttestationResponse",
    "AuthenticatorAssertionResponse", "AuthenticationExtensionsClientInputs",
    "AuthenticationExtensionsClientOutputs",
    "CredentialCreationOptions", "CredentialRequestOptions",
    "AuthenticatorSelectionCriteria",
], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
# JsFuture isn't Send (JS values can't cross real threads), but
# #[async_trait]'s default macro expansion requires Send futures for
# Ctap2Transport (shared with the native/multi-threaded-tokio impls). This
# is the standard fix: wasm32 has no real threads, so asserting Send here
# is provably safe on this target specifically.
send_wrapper = { version = "0.6", features = ["futures"], optional = true }

# Optional plugin dependencies
josekit = { version = "0.10", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }
r2ps-client = { git = "https://github.com/sirosfoundation/r2ps-client.git", optional = true }
# CBOR/COSE decoding for the previewSign protocol module. Pure Rust, no_std-
# friendly — builds cleanly on wasm32 as well as native targets.
ciborium = { version = "0.2", optional = true }
# CTAP2 ClientPin/PinUvAuthProtocol (getKeyAgreement/getPinUvAuthToken):
# ECDH key agreement (p256/ecdh), shared-secret key derivation (sha2/hkdf),
# pinHashEnc/pinUvAuthToken encryption (aes/cbc), pinUvAuthParam (hmac).
hkdf = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
# ARKG (draft-bradleylundberg-cfrg-arkg) public-key derivation for
# previewSign's generateKey ceremony - RFC 9380 hash-to-field needs a
# reduction of a 48-byte value mod the (256-bit) P-256 scalar order, wider
# than p256's own Scalar type; num-bigint keeps that one step simple and
# obviously correct rather than hand-rolling wide reduction.
num-bigint = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

# Enable wasm_js feature for getrandom when targeting WASM.
# This is needed because p256/rand pull in getrandom transitively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
